name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  setup:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - uses: actions/cache/save@v4
        with:
          path: ./
          key: ${{ github.sha }}-setup

  test:
    needs: setup
    runs-on: macos-15
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ./
          key: ${{ github.sha }}-setup
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Inject Firebase secrets
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: sed -i '' "s/\${GOOGLE_API_KEY}/${GOOGLE_API_KEY}/" MBC/Resources/GoogleService-Info.plist
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run tests
        run: bundle exec fastlane unit_tests
      - name: Convert Coverage to SonarQube Format
        run: |
          mkdir -p coverage
          bash ./scripts/xccov-to-sonarqube-generic.sh ./test_output/MBC.xcresult/ > coverage/sonarqube-generic-coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage/sonarqube-generic-coverage.xml
      - uses: actions/cache/save@v4
        with:
          path: ./
          key: ${{ github.sha }}-test

  sonar:
    name: SonarQube Analysis
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ./
          key: ${{ github.sha }}-test
      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    needs: setup
    runs-on: macos-15
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ./
          key: ${{ github.sha }}-setup
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install tools
        run: |
          brew install swiftlint
          brew install swiftformat
      - name: Lint
        run: bundle exec fastlane lint
